<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Apple TV - Video Pembelajaran</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .wrap { width: 100%; max-width: 780px; margin: 0 auto; }
  .tv {
    padding: 13px; border-radius: 30px;
    background: linear-gradient(145deg, #ffd8e9, #ff8fc3 35%, #f45ca5 68%, #c92f7b);
    border: 3px solid #ffb6d5;
    box-shadow: 0 12px 22px rgba(176,48,111,.25), inset 0 2px 4px rgba(255,255,255,.85);
  }
  .screen-shell {
    padding: 7px; border-radius: 20px;
    background: linear-gradient(145deg, #ffeff6, #d94a91);
    border: 2px solid rgba(255,255,255,.8);
    box-shadow: inset 0 2px 5px rgba(130,20,75,.25);
  }
  .screen {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    overflow: hidden; background: #111;
    border: 3px solid #fff0f7; border-radius: 13px;
  }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 7px 2px; color: #fff; }
  .brand { font-size: clamp(11px,2.2vw,15px); font-weight: 700; letter-spacing: 1.8px; text-shadow: 0 1px 2px rgba(100,0,45,.25); }
  .controls { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #70ff9c; box-shadow: 0 0 7px #70ff9c; }
  .knob { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(145deg,#fff,#f6b4d4); border: 2px solid #fff0f7; box-shadow: 0 2px 3px rgba(100,0,45,.2); }
  .stand { width: 25%; height: 13px; margin: 0 auto; background: linear-gradient(#f58cbd,#d34c91); border-radius: 0 0 7px 7px; }
  .foot { width: 42%; height: 9px; margin: 0 auto; background: linear-gradient(#f7a6cc,#c93f84); border-radius: 50%; }
  .caption { margin-top: 12px; text-align: center; color: #c83d83; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tv">
      <div class="screen-shell">
        <div class="screen">
          <iframe
            src="https://www.youtube.com/embed/aTWwGQSsL3Q"
            title="Video pembelajaran"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </div>
      <div class="bottom">
        <div class="brand"> PINK TV</div>
        <div class="controls">
          <span class="dot"></span><span style="font-size:10px;font-weight:700;letter-spacing:1px;">ON</span><span class="knob"></span>
        </div>
      </div>
    </div>
    <div class="stand"></div><div class="foot"></div>
    <div class="caption">♡ Jom Belajar Bersama! ♡</div>
  </div>
</body>
</html>
